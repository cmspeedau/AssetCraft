[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cmspeedau/AssetCraft"
authors = ["AssetCraft contributors"]

[workspace.dependencies]
assetcraft-auth = { version = "0.1.0", path = "crates/assetcraft-auth" }
assetcraft-catalog = { version = "0.1.0", path = "crates/assetcraft-catalog" }
assetcraft-core = { version = "0.1.0", path = "crates/assetcraft-core" }
assetcraft-download = { version = "0.1.0", path = "crates/assetcraft-download" }
assetcraft-library = { version = "0.1.0", path = "crates/assetcraft-library" }

anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
flate2 = "1"
# TLS comes from the system OpenSSL via native-tls. reqwest 0.13's default
# (rustls + aws-lc-rs) needs cmake, which is not guaranteed to be installed.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "form",
    "cookies",
    "gzip",
    "native-tls",
] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
