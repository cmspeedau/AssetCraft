name: Release

# Keep the human-facing release page useful as the platform build matrix
# finishes in parallel: GitHub's generated notes summarize the merged PRs,
# while each workflow publishes only its own verified artifacts.
# The auto-update channel is this workflow's output. One `v*` tag, one
# release, and every asset named exactly as `assetcraft-update` looks for
# it: `assetcraft-<cli|gui>-<target triple>[.exe]` — the raw binary, not a
# zip, because the update swaps the binary itself. GitHub computes a SHA-256
# digest for stored assets, and that digest is what a running copy verifies
# a download against; an asset that is merely linked, not stored, arrives
# without one and the updater then refuses it. The installers humans download
# are built by package.yml off the same tag; this workflow stays deliberately
# only the updater's raw feed.

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: ""
          - os: macos-latest # Apple Silicon host; native arm64…
            target: aarch64-apple-darwin
            exe: ""
          - os: macos-latest # …and a cross to Intel Macs.
            target: x86_64-apple-darwin
            exe: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: ".exe"
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Name the binaries as the update crate expects
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release"
          mv "$src/assetcraft${{ matrix.exe }}" \
             "assetcraft-cli-${{ matrix.target }}${{ matrix.exe }}"
          mv "$src/assetcraft-gui${{ matrix.exe }}" \
             "assetcraft-gui-${{ matrix.target }}${{ matrix.exe }}"

      - name: Publish to the release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            assetcraft-cli-${{ matrix.target }}${{ matrix.exe }}
            assetcraft-gui-${{ matrix.target }}${{ matrix.exe }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
