name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  addon:
    name: Blender addon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      # `runner.temp` is only available at step level, which is fine: these
      # two steps are the whole conversation about where the fixture lives.
      - name: Build an export with the Rust exporter
        env:
          ASSETCRAFT_ADDON_FIXTURE: ${{ runner.temp }}/addon-fixture
        run: cargo test -p assetcraft-dcc-blender --test addon_fixture

      - name: Run it through the addon's Python tests
        env:
          ASSETCRAFT_ADDON_FIXTURE: ${{ runner.temp }}/addon-fixture
        run: python3 -m unittest discover -s blender_addon/tests -v
